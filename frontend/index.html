<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
  <main class="board">
    <header>

 <script src="/static/script.js"></script>
